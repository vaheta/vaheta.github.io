- title: "5toguess"
  description: "A daily word-guessing game: one hidden word, five image clues, five guesses — reveal more clues at the cost of guesses. The games create themselves: an AI agent generates each puzzle and another AI plays it blind to validate the difficulty."
  date: "2025-07-01"
  display_date: "2025"
  thumbnail: "/assets/images/projects/5toguess-today.png"
  links:
    demo: "https://5toguess.com"
    writeup: "/projects/5toguess/"

- title: "LookAtArts"
  description: "A daily visual meditation — one artwork a day from the Met's open-access collection, presented with nothing competing for your attention. No feed, no scrolling, just one piece of art and time to look at it."
  date: "2025-06-01"
  display_date: "2025"
